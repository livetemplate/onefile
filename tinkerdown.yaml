# Log sources for the viewer. Each stream source follows one command or file;
# "all" merges them into the timeline the page shows. Add your own and list
# them in all.inputs and in the tabs heading of index.md.
#
# Commands need: tinkerdown serve --allow-exec
sources:
  web:
    type: stream
    cmd: ./scripts/demo-logs.sh web
  worker:
    type: stream
    cmd: ./scripts/demo-logs.sh worker
  app:
    type: stream
    file: ./logs/app.log

  # A docker container (stdout and stderr stay separate):
  # api:
  #   type: stream
  #   cmd: docker logs -f --timestamps --tail 200 api
  #
  # The system journal:
  # journal:
  #   type: stream
  #   cmd: journalctl -f -n 200 -o short-iso
  #
  # A kubernetes deployment:
  # pods:
  #   type: stream
  #   cmd: kubectl logs -f --timestamps --tail 200 deploy/api

  all:
    type: merge
    inputs: [web, worker, app]
    buffer: 5000
